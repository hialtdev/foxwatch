name: Deploy → Production

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Promote SHA → Production
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to :production tag
        run: |
          SHA="${{ github.sha }}"
          docker pull "${{ env.IMAGE }}:${SHA}"
          docker tag  "${{ env.IMAGE }}:${SHA}" "${{ env.IMAGE }}:production"
          docker push "${{ env.IMAGE }}:production"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CI }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure production namespace exists
        run: kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize (production)
        run: kubectl apply -k k8s/production

      - name: Deploy to production
        run: |
          SHA="${{ github.sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foxwatch \
            --namespace production \
            --timeout=180s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n production -l app=foxwatch
          kubectl logs -n production deployment/foxwatch --tail=30