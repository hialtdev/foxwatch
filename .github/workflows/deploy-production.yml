name: Deploy → Production

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Promote SHA → Production
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Promote image to :production tag
        run: |
          SHA="${{ github.sha }}"
          # Pull the exact image staging validated — no Rust compile, no Docker build
          docker pull "${{ env.IMAGE }}:${SHA}"
          docker tag  "${{ env.IMAGE }}:${SHA}" "${{ env.IMAGE }}:production"
          docker push "${{ env.IMAGE }}:production"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to production
        run: |
          SHA="${{ github.sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace production
          kubectl rollout status deployment/foxwatch \
            --namespace production \
            --timeout=120s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n production -l app=foxwatch
          kubectl logs -n production deployment/foxwatch --tail=30