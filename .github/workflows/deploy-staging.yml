name: Deploy → Staging

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ dev ]
    types: [ completed ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Build · Push · Deploy (staging)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker build \
            -t "${{ env.IMAGE }}:${SHA}" \
            -t "${{ env.IMAGE }}:staging" \
            .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

      # ── Deploy ─────────────────────────────────────────────────────────────

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CI }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure staging namespace exists
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foxwatch \
            --namespace staging \
            --timeout=180s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n staging -l app=foxwatch
          kubectl logs -n staging deployment/foxwatch --tail=30