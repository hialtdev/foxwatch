name: Deploy → Staging

on:
  push:
    branches: [ dev ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Build · Push · Deploy (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify secret is accessible
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "SECRET IS EMPTY"
          else
            echo "SECRET HAS CONTENT"
          fi

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${{ github.sha }}"
          docker build \
            -t "${{ env.IMAGE }}:${SHA}" \
            -t "${{ env.IMAGE }}:staging" \
            .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      

      - name: Debug kubeconfig
        run: |
          echo "=== kubeconfig first 20 lines ==="
          sed -n '1,20p' ~/.kube/config
      
          echo "=== kubectl config view ==="
          kubectl config view
      
          echo "=== test cluster connection ==="
          kubectl get nodes


      - name: Ensure staging namespace exists
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize (staging)
        run: kubectl apply -k k8s/staging


      - name: Deploy to staging
        run: |
          SHA="${{ github.sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foxwatch \
            --namespace staging \
            --timeout=180s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n staging -l app=foxwatch
          kubectl logs -n staging deployment/foxwatch --tail=30