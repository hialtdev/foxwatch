name: Deploy → Staging

on:
  push:
    branches: [ dev ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Build · Push · Deploy (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify secret is accessible
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "SECRET IS EMPTY"
          else
            echo "SECRET HAS CONTENT"
          fi

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${{ github.sha }}"
          docker build \
            -t "${{ env.IMAGE }}:${SHA}" \
            -t "${{ env.IMAGE }}:staging" \
            .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          
          # --- DEBUG STEP RESTORED & ENHANCED ---
          echo "Checking file existence:"
          ls -l ~/.kube/config
          
          echo "Checking file content (first 5 lines):"
          head -n 5 ~/.kube/config
          
          echo "Verifying kubectl sees the config:"
          kubectl config view
          
          echo "Testing connection:"
          kubectl get nodes --kubeconfig=$HOME/.kube/config

      - name: Ensure staging namespace exists
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -


      - name: Deploy to staging
        run: |
          SHA="${{ github.sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foxwatch \
            --namespace staging \
            --timeout=180s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n staging -l app=foxwatch
          kubectl logs -n staging deployment/foxwatch --tail=30