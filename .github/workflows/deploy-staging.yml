name: Deploy → Staging

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ dev ]
    types: [ completed ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Build · Push · Deploy (staging)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker build \
            -t "${{ env.IMAGE }}:${SHA}" \
            -t "${{ env.IMAGE }}:staging" \
            .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to staging
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          kubectl set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace staging
          kubectl rollout status deployment/foxwatch \
            --namespace staging \
            --timeout=120s

      - name: Smoke check
        if: always()
        run: |
          kubectl get pods -n staging -l app=foxwatch
          kubectl logs -n staging deployment/foxwatch --tail=30