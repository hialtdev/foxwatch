name: Deploy → Staging

on:
  push:
    branches: [ dev ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${{ github.sha }}"
          docker build -t "${{ env.IMAGE }}:${SHA}" -t "${{ env.IMAGE }}:staging" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          mkdir -p ~/.kube
          # We write the raw base64 string to a temp file, then decode it
          echo "$KUBECONFIG_DATA" > config.b64
          base64 -d config.b64 > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Deploy to staging
        run: |
          cd k8s/staging         
          kubectl apply -k .          
          kubectl rollout restart deployment/foxwatch -n staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foxwatch -n staging --timeout=180s
