name: Deploy → Staging

on:
  push:
    branches: [ dev ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/foxwatch

jobs:
  deploy:
    name: Build · Push · Deploy (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${{ github.sha }}"
          docker build -t "${{ env.IMAGE }}:${SHA}" -t "${{ env.IMAGE }}:staging" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:staging"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Debug Connection
        run: |
          kubectl --kubeconfig=$KUBECONFIG config current-context
          kubectl --kubeconfig=$KUBECONFIG get nodes

      - name: Ensure staging namespace exists
        run: kubectl --kubeconfig=$KUBECONFIG create namespace staging --dry-run=client -o yaml | kubectl --kubeconfig=$KUBECONFIG apply -f -

      - name: Apply Kustomize (staging)
        run: kubectl --kubeconfig=$KUBECONFIG apply -k k8s/staging

      - name: Deploy to staging
        run: |
          SHA="${{ github.sha }}"
          kubectl --kubeconfig=$KUBECONFIG set image deployment/foxwatch \
            foxwatch="${{ env.IMAGE }}:${SHA}" \
            --namespace staging

      - name: Wait for rollout
        run: |
          kubectl --kubeconfig=$KUBECONFIG rollout status deployment/foxwatch \
            --namespace staging \
            --timeout=180s

      - name: Smoke check
        if: always()
        run: |
          kubectl --kubeconfig=$KUBECONFIG get pods -n staging -l app=foxwatch
          kubectl --kubeconfig=$KUBECONFIG logs -n staging deployment/foxwatch --tail=30