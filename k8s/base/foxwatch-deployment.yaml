apiVersion: apps/v1
kind: Deployment
metadata:
  name: foxwatch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foxwatch
  template:
    metadata:
      labels:
        app: foxwatch
    spec:
      containers:
        - name: foxwatch
          # CI overwrites this field via `kubectl set image` on every deploy.
          # This value is just a valid placeholder for `kubectl apply`.
          image: ghcr.io/hialtdev/foxwatch:staging
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: foxwatch-config
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["pgrep", "foxwatch"]
            initialDelaySeconds: 5
            periodSeconds: 30