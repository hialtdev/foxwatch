[package]
name    = "foxwatch"
version = "0.1.0"
edition = "2021"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# MQTT client (async)
rumqttc = "0.24"

# Serialization — JSON now, binary-ready later
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging
log        = "0.4"
env_logger = "0.11"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Unique message IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Binary serialization (uncomment when ready)
# postcard = { version = "1", features = ["alloc"] }

# Kafka producer — cmake-build compiles librdkafka from source
rdkafka = { version = "0.36", features = ["cmake-build"] }
